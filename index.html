<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>资产管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F0E9F6">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F0E9F6;
      min-height: 100vh;
      min-height: 100dvh;
      color: #2d2d3a;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      overflow-x: hidden;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 100px;
      position: relative;
    }

    /* ========== 紫色弧线背景 ========== */
    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 160px;
      background: #946FB2;
      border-radius: 0 0 50% 50% / 0 0 80px 80px;
      z-index: 0;
    }

    /* ========== 顶部总资产卡片 ========== */
    .total-card {
      position: relative;
      z-index: 1;
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.5);
      border-radius: 24px;
      padding: 24px 22px 20px;
      margin-top: 60px;
      margin-bottom: 24px;
      color: #fff;
      box-shadow: 0 0 20px rgba(255,255,255,0.15), 0 0 40px rgba(255,255,255,0.05);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .total-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .total-label {
      font-size: 0.8rem;
      font-weight: 400;
      opacity: 0.85;
    }

    .total-pnl {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
    }

    .total-pnl.up { color: #34d399; }
    .total-pnl.down { color: #f87171; }

    .total-amount {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .total-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .total-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.18);
      font-size: 0.72rem;
      font-weight: 500;
      color: #fff;
    }

    .total-tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* ========== 标题行 ========== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #6b3fa0;
    }

    .sort-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: none;
      background: rgba(107, 63, 160, 0.08);
      color: #946FB2;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .sort-btn:active { background: rgba(107, 63, 160, 0.15); }

    /* ========== 资产网格 ========== */
    .asset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .asset-card {
      background: #F7F2FB;
      border-radius: 16px;
      padding: 16px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s;
    }

    .asset-card:active { transform: scale(0.97); }

    .asset-info { flex: 1; min-width: 0; }

    .asset-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }

    .asset-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #6b3fa0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .asset-pnl {
      font-size: 0.65rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .asset-pnl.up { color: #ef4444; }
    .asset-pnl.down { color: #22c55e; }
    .asset-pnl.flat { color: #9ca3af; }

    .asset-amount {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: #6b3fa0;
    }

    .asset-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(148, 111, 178, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #946FB2;
      font-size: 1rem;
    }

    /* ========== 底部导航栏 ========== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      box-shadow: 0 -2px 20px rgba(0,0,0,0.06);
      max-width: 480px;
      margin: 0 auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: #b0b0b8;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 4px 12px;
      transition: color 0.2s;
      cursor: pointer;
    }

    .nav-item i { font-size: 1.15rem; }
    .nav-item.active { color: #946FB2; }
    .nav-item.active i { color: #946FB2; }

    /* ========== 空状态 ========== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #b0a4c4;
    }

    .empty-state i { font-size: 2.5rem; margin-bottom: 12px; display: block; opacity: 0.5; }
    .empty-state p { font-size: 0.85rem; }

    /* ========== 弹窗 ========== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .modal-overlay.show { display: flex; }

    .modal-box {
      background: #fff;
      border-radius: 20px;
      width: 85%;
      max-width: 340px;
      padding: 24px 20px;
      animation: scaleIn 0.25s ease;
    }

    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    .modal-title {
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      color: #2d2d3a;
    }

    .modal-input {
      width: 100%;
      padding: 12px 14px;
      background: #F7F2FB;
      border: 1px solid rgba(148,111,178,0.2);
      border-radius: 12px;
      color: #2d2d3a;
      font-size: 0.95rem;
      font-family: inherit;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .modal-input:focus { outline: none; border-color: #946FB2; }
    .modal-input::placeholder { color: #b0a4c4; }

    .modal-btns { display: flex; gap: 10px; }

    .modal-btn {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .modal-btn-cancel { background: #F0E9F6; color: #6b3fa0; }
    .modal-btn-confirm { background: #946FB2; color: #fff; font-weight: 600; }

    /* ========== Toast ========== */
    .save-toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(34, 197, 94, 0.95);
      color: #fff;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 2000;
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

    /* ========== FAB ========== */
    .fab {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #946FB2;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(148,111,178,0.4);
      transition: transform 0.2s;
      z-index: 100;
    }

    .nav-add-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #946FB2;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(148,111,178,0.4);
      margin-top: -20px;
      transition: transform 0.2s;
    }

    .nav-add-btn:active { transform: scale(0.9); }
  </style>
</head>
<body>
  <div class="hero-bg"></div>
  <div class="page">
    <!-- 顶部总资产卡片 -->
    <div class="total-card" id="totalCard">
      <div class="total-top">
        <span class="total-label">总资产 (CNY)</span>
        <span class="total-pnl" id="monthPnl">本月 +0.00</span>
      </div>
      <div class="total-amount" id="totalAmount">¥0.00</div>
      <div class="total-tags" id="totalTags"></div>
    </div>

    <!-- 标题行 -->
    <div class="section-header">
      <div class="section-title">资产分类</div>
      <button class="sort-btn" id="sortBtn" onclick="toggleSort()"><i class="fa-solid fa-arrow-down-wide-short"></i></button>
    </div>

    <!-- 资产网格 -->
    <div class="asset-grid" id="assetGrid"></div>
  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a class="nav-item active" onclick="switchPage('assets')"><i class="fa-solid fa-wallet"></i>资产</a>
    <a class="nav-item" onclick="switchPage('history')"><i class="fa-solid fa-clock-rotate-left"></i>历史</a>
    <button class="nav-add-btn" onclick="showAddModal()"><i class="fa-solid fa-plus"></i></button>
    <a class="nav-item" onclick="switchPage('chart')"><i class="fa-solid fa-chart-pie"></i>可视化</a>
    <a class="nav-item" onclick="switchPage('ai')"><i class="fa-solid fa-robot"></i>AI报告</a>
  </nav>

  <!-- 新增弹窗 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-box">
      <div class="modal-title">新增资产</div>
      <input type="text" class="modal-input" id="addModalInput" placeholder="例如：支付宝、银行卡...">
      <select class="modal-input" id="addModalType" style="margin-bottom:16px;appearance:auto;">
        <option value="流动">流动</option>
        <option value="基金">基金</option>
        <option value="股票">股票</option>
      </select>
      <div class="modal-btns">
        <button class="modal-btn modal-btn-cancel" onclick="hideAddModal()">取消</button>
        <button class="modal-btn modal-btn-confirm" onclick="confirmAddSource()">添加</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/funds.js"></script>
</body>
</html>
