<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI报告</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="icon.png" type="image/png">
  <meta name="theme-color" content="#F0E9F6">
  <link rel="stylesheet" href="js/theme.css">
  <script src="js/theme.js"></script>
  <script src="js/chart.min.js"></script>
  <script src="js/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      color: #2d2d3a;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 100px;
    }

    /* ========== 顶部导航 ========== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .top-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2d2d3a;
    }

    .history-btn {
      padding: 6px 14px;
      border: 1px solid rgba(148,111,178,0.2);
      border-radius: 12px;
      background: transparent;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .history-btn:active { background: rgba(148,111,178,0.08); }

    /* ========== 状态提示条 ========== */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--card);
      border-radius: 14px;
      margin-bottom: 16px;
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.pending { background: #f59e0b; }
    .status-dot.completed { background: #22c55e; }

    .status-text { flex: 1; }
    .status-label { color: #9ca3af; font-size: 0.75rem; }

    /* ========== 提问卡片 ========== */
    .form-card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px 16px;
      margin-bottom: 16px;
    }

    .question-item {
      margin-bottom: 18px;
    }
    .question-item:last-of-type { margin-bottom: 0; }

    .question-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #2d2d3a;
      margin-bottom: 10px;
    }

    .question-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .question-textarea {
      width: 100%;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid rgba(148,111,178,0.15);
      border-radius: 12px;
      color: #2d2d3a;
      font-size: 0.85rem;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      transition: border-color 0.2s;
    }
    .question-textarea:focus { outline: none; border-color: var(--primary); }
    .question-textarea::placeholder { color: #ccc; }

    .generate-btn {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
      box-shadow: 0 4px 16px rgba(148,111,178,0.3);
    }
    .generate-btn:active { opacity: 0.85; }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ========== 报告展示 ========== */
    .report-card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px 16px;
      margin-bottom: 16px;
    }

    .report-content {
      font-size: 0.88rem;
      line-height: 1.7;
      color: #2d2d3a;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .report-content h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      margin: 16px 0 8px;
    }
    .report-content h3:first-child { margin-top: 0; }

    .report-content p {
      margin-bottom: 8px;
    }

    .report-content .md-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.8rem;
    }

    .report-content .md-table th {
      background: rgba(var(--primary-rgb), 0.08);
      padding: 8px 10px;
      text-align: left;
      font-weight: 600;
      color: var(--accent);
      border-bottom: 2px solid rgba(var(--primary-rgb), 0.15);
    }

    .report-content .md-table td {
      padding: 7px 10px;
      border-bottom: 1px solid rgba(148,111,178,0.08);
      color: #2d2d3a;
    }

    .report-content .md-table tr:last-child td {
      border-bottom: none;
    }

    /* 图表容器样式 */
    .chart-placeholder {
      margin: 4px 0;
      min-height: 50px;
    }

    .chart-placeholder canvas {
      border-radius: 12px;
      background: #fff;
      padding: 12px;
    }

    .report-btns {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .report-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-family: inherit;
      text-align: center;
    }

    .report-btn-edit {
      background: #fff;
      color: var(--accent);
      border: 1px solid rgba(148,111,178,0.2);
    }
    .report-btn-edit:active { background: var(--bg); }

    .report-btn-history {
      background: var(--primary);
      color: #fff;
    }
    .report-btn-history:active { opacity: 0.85; }

    /* ========== 历史报告弹窗 ========== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }

    .modal-box {
      background: #fff;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 75vh;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      animation: slideUp 0.3s ease;
      overflow-y: auto;
    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 600;
      color: #2d2d3a;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--bg);
      color: var(--accent);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ========== 时间轴 ========== */
    .timeline { list-style: none; }

    .timeline-item {
      position: relative;
      padding: 0 0 20px 24px;
    }
    .timeline-item:last-child { padding-bottom: 0; }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 0;
      width: 2px;
      background: rgba(148,111,178,0.15);
    }
    .timeline-item:last-child::before { display: none; }

    .timeline-dot {
      position: absolute;
      left: 0;
      top: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      border: 3px solid var(--bg);
    }

    .timeline-month {
      font-size: 0.9rem;
      font-weight: 600;
      color: #2d2d3a;
      margin-bottom: 4px;
    }

    .timeline-date {
      font-size: 0.72rem;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .timeline-btn {
      padding: 6px 14px;
      border: 1px solid rgba(148,111,178,0.2);
      border-radius: 10px;
      background: transparent;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .timeline-btn:active { background: rgba(148,111,178,0.08); }

    .empty-hint {
      text-align: center;
      padding: 40px 20px;
      color: #b0a4c4;
      font-size: 0.85rem;
    }
    .empty-hint i { font-size: 1.5rem; display: block; margin-bottom: 8px; opacity: 0.4; }

    /* ========== 编辑弹窗 ========== */
    .edit-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .edit-overlay.show { display: flex; }

    .edit-box {
      background: #fff;
      border-radius: 20px;
      width: 85%;
      max-width: 380px;
      max-height: 75vh;
      padding: 24px 20px;
      animation: scaleIn 0.25s ease;
      overflow-y: auto;
    }

    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    .edit-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #2d2d3a;
      margin-bottom: 8px;
      margin-top: 14px;
    }
    .edit-label:first-child { margin-top: 0; }

    .edit-textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid rgba(148,111,178,0.15);
      border-radius: 10px;
      color: #2d2d3a;
      font-size: 0.85rem;
      font-family: inherit;
      resize: vertical;
      min-height: 50px;
      transition: border-color 0.2s;
    }
    .edit-textarea:focus { outline: none; border-color: var(--primary); }

    .edit-btns {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .edit-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .edit-btn-cancel { background: var(--bg); color: var(--accent); }
    .edit-btn-confirm { background: var(--primary); color: #fff; font-weight: 600; }

    /* ========== Toast ========== */
    .save-toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(34, 197, 94, 0.95);
      color: #fff;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 2000;
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

    /* ========== 底部导航 ========== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      box-shadow: 0 -2px 20px rgba(0,0,0,0.06);
      max-width: 480px;
      margin: 0 auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: #b0b0b8;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 4px 12px;
      transition: color 0.2s;
      cursor: pointer;
    }

    .nav-item i { font-size: 1.15rem; }
    .nav-item.active { color: var(--primary); }
    .nav-item.active i { color: var(--primary); }

    .nav-add-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(148,111,178,0.4);
      margin-top: -20px;
      transition: transform 0.2s;
    }
    .nav-add-btn:active { transform: scale(0.9); }

    /* ========== 加载动画 ========== */
    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 40px;
      color: var(--primary);
      font-size: 0.85rem;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(148,111,178,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page">
    <!-- 顶部 -->
    <div class="top-bar">
      <span class="top-title">AI资产报告</span>
      <button class="history-btn" onclick="showHistoryModal()">历史报告</button>
    </div>

    <!-- 状态提示条 -->
    <div class="status-bar" id="statusBar">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText"></span>
      <span class="status-label" id="statusLabel"></span>
    </div>

    <!-- 主内容区 -->
    <div id="mainContent"></div>
  </div>

  <!-- 历史报告弹窗 -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">历史报告</span>
        <button class="modal-close" onclick="hideHistoryModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- 重新编辑弹窗 -->
  <div class="edit-overlay" id="editModal">
    <div class="edit-box">
      <div class="modal-header">
        <span class="modal-title">重新编辑</span>
        <button class="modal-close" onclick="hideEditModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="editForm"></div>
      <div class="edit-btns">
        <button class="edit-btn edit-btn-cancel" onclick="hideEditModal()">取消</button>
        <button class="edit-btn edit-btn-confirm" onclick="regenerateFromEdit()">重新生成</button>
      </div>
    </div>
  </div>

  <!-- 查看报告弹窗 -->
  <div class="modal-overlay" id="viewReportModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="viewReportTitle"></span>
        <button class="modal-close" onclick="hideViewReportModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="report-content" id="viewReportContent"></div>
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-wallet"></i>首页</a>
    <a href="index.html" class="nav-item" onclick="sessionStorage.setItem('switchTo','history')" style="position:relative;"><i class="fa-solid fa-clock-rotate-left"></i>记录</a>
    <button class="nav-add-btn" onclick="location.href='index.html#openAdd'"><i class="fa-solid fa-plus"></i></button>
    <a class="nav-item active"><i class="fa-solid fa-robot"></i>AI报告</a>
    <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i>我的</a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/ai.js"></script>
</body>
</html>
