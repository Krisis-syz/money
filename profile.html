<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="icon.png" type="image/png">
  <meta name="theme-color" content="#F0E9F6">
  <script src="js/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F0E9F6;
      min-height: 100vh;
      min-height: 100dvh;
      color: #2d2d3a;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 100px;
    }

    .page-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #6b3fa0;
      margin-bottom: 24px;
    }

    .profile-card {
      background: rgba(168, 124, 197, 0.65);
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 24px 20px;
      color: #fff;
      text-align: center;
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .profile-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .profile-email {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .menu-card {
      background: #F7F2FB;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(148,111,178,0.08);
      cursor: pointer;
      transition: background 0.2s;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: rgba(148,111,178,0.06); }

    .menu-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      font-size: 0.95rem;
    }

    .menu-text {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .menu-arrow {
      color: #b0a4c4;
      font-size: 0.85rem;
    }

    .logout-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #fff;
      color: #ef4444;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .logout-btn:active { background: #fef2f2; }

    .version {
      text-align: center;
      color: #b0a4c4;
      font-size: 0.75rem;
      margin-top: 30px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      box-shadow: 0 -2px 20px rgba(0,0,0,0.06);
      max-width: 480px;
      margin: 0 auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: #b0b0b8;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 4px 12px;
      cursor: pointer;
    }

    .nav-item i { font-size: 1.15rem; }
    .nav-item.active { color: #946FB2; }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-title">我的</div>

    <div class="profile-card">
      <div class="profile-avatar" id="avatar">-</div>
      <div class="profile-email" id="email">加载中...</div>
    </div>

    <div class="menu-card">
      <div class="menu-item" onclick="handleLogout()">
        <div class="menu-icon" style="background:rgba(239,68,68,0.1);color:#ef4444;">
          <i class="fa-solid fa-right-from-bracket"></i>
        </div>
        <div class="menu-text" style="color:#ef4444;">退出登录</div>
        <div class="menu-arrow"><i class="fa-solid fa-chevron-right"></i></div>
      </div>
    </div>

    <div class="version">资产管理 v1.0.0</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-wallet"></i>资产</a>
    <a href="index.html" class="nav-item" onclick="sessionStorage.setItem('switchTo','history')"><i class="fa-solid fa-clock-rotate-left"></i>记录</a>
    <a href="index.html" class="nav-item" onclick="sessionStorage.setItem('switchTo','ai')"><i class="fa-solid fa-robot"></i>AI报告</a>
    <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i>我的</a>
  </nav>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await waitForSupabase();
      if (!(await requireAuth())) return;
      const user = await getCurrentUser();
      if (user) {
        document.getElementById('email').textContent = user.email;
        document.getElementById('avatar').textContent = user.email.charAt(0).toUpperCase();
      }
    });

    function handleLogout() {
      if (confirm('确定要退出登录吗？')) {
        signOut();
      }
    }
  </script>
</body>
</html>
