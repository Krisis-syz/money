<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>总资产详情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="icon.png" type="image/png">
  <meta name="theme-color" content="#F0E9F6">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F0E9F6;
      min-height: 100vh;
      min-height: 100dvh;
      color: #2d2d3a;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px 40px;
    }

    /* ========== 顶部导航 ========== */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(148,111,178,0.1);
      border: none;
      color: #6b3fa0;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    .back-btn:active { background: rgba(148,111,178,0.2); }

    .top-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2d2d3a;
    }

    /* ========== 资产卡片 ========== */
    .asset-card {
      background: rgba(168, 124, 197, 0.65);
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 24px;
      padding: 24px 22px 20px;
      margin-bottom: 20px;
      color: #fff;
      box-shadow: 0 0 20px rgba(255,255,255,0.1), 0 4px 20px rgba(148,111,178,0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .asset-card-label {
      font-size: 0.8rem;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .asset-card-amount {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .asset-card-tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .asset-tag {
      padding: 5px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
    }

    .asset-tag-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      margin-left: 4px;
    }

    /* ========== 模块框 ========== */
    .module {
      background: #F7F2FB;
      border-radius: 20px;
      padding: 18px 16px;
      margin-bottom: 16px;
    }

    .module-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .module-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #6b3fa0;
    }

    .module-tabs {
      display: flex;
      gap: 4px;
      background: rgba(148,111,178,0.08);
      border-radius: 10px;
      padding: 3px;
    }

    .module-tab {
      padding: 5px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #9ca3af;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .module-tab.active {
      background: #fff;
      color: #6b3fa0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .range-group {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .range-btn {
      padding: 4px 10px;
      border: 1px solid rgba(148,111,178,0.15);
      border-radius: 12px;
      background: transparent;
      color: #9ca3af;
      font-size: 0.68rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .range-btn.active {
      background: rgba(148,111,178,0.12);
      color: #6b3fa0;
      border-color: rgba(148,111,178,0.25);
    }

    .chart-wrap { position: relative; height: 180px; }

    /* ========== 历史记录 ========== */
    .history-divider {
      display: flex;
      align-items: center;
      margin: 16px 0 12px;
      color: #9ca3af;
      font-size: 0.72rem;
    }

    .history-divider::before, .history-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(148,111,178,0.12);
    }

    .history-divider span { padding: 0 10px; }

    .history-table {
      width: 100%;
      border-collapse: collapse;
    }

    .history-table th {
      text-align: left;
      padding: 6px 0;
      font-size: 0.68rem;
      color: #9ca3af;
      font-weight: 500;
      border-bottom: 1px solid rgba(148,111,178,0.1);
    }

    .history-table td {
      padding: 10px 0;
      font-size: 0.82rem;
      border-bottom: 1px solid rgba(148,111,178,0.06);
    }

    .history-table .mono {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
    }

    .more-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px dashed rgba(148,111,178,0.3);
      border-radius: 12px;
      background: transparent;
      color: #946FB2;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
    }

    .more-btn:active { background: rgba(148,111,178,0.08); }

    /* ========== 分类变化标签 ========== */
    .cat-changes {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .cat-change {
      flex: 1;
      min-width: 80px;
      padding: 10px;
      background: #fff;
      border-radius: 12px;
      text-align: center;
    }

    .cat-change-name {
      font-size: 0.72rem;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .cat-change-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* ========== 月份选择器 ========== */
    .month-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .month-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(148,111,178,0.15);
      background: transparent;
      color: #946FB2;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .month-btn:active { background: rgba(148,111,178,0.1); }

    .month-text {
      font-size: 0.75rem;
      font-weight: 500;
      color: #6b3fa0;
      min-width: 60px;
      text-align: center;
    }

    /* ========== 柱形图 ========== */
    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 10px;
    }

    .bar-bg.positive { background: rgba(239,68,68,0.08); }
    .bar-bg.negative { background: rgba(34,197,94,0.08); }
    .bar-bg.flat { background: rgba(156,163,175,0.06); }

    .bar-name {
      flex: 1;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 12px 0 12px 12px;
      position: relative;
      z-index: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-amount {
      width: 90px;
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 12px 0;
      position: relative;
      z-index: 1;
    }

    .bar-pnl {
      width: 80px;
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 12px 12px 12px 0;
      position: relative;
      z-index: 1;
    }

    .sort-btns {
      display: flex;
      gap: 4px;
      margin-top: 10px;
    }

    .sort-btn {
      padding: 4px 10px;
      border: 1px solid rgba(148,111,178,0.15);
      border-radius: 10px;
      background: transparent;
      color: #9ca3af;
      font-size: 0.68rem;
      cursor: pointer;
    }

    .sort-btn.active {
      background: rgba(148,111,178,0.12);
      color: #6b3fa0;
      border-color: rgba(148,111,178,0.25);
    }

    .empty-hint {
      text-align: center;
      padding: 30px 20px;
      color: #b0a4c4;
      font-size: 0.85rem;
    }

    .empty-hint i { font-size: 1.5rem; display: block; margin-bottom: 8px; opacity: 0.4; }
  </style>
</head>
<body>
  <div class="page">
    <!-- 顶部导航 -->
    <div class="top-bar">
      <a href="index.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
      <span class="top-title">总资产详情</span>
    </div>

    <!-- 资产卡片 -->
    <div class="asset-card" id="assetCard">
      <div class="asset-card-label">总资产 (CNY)</div>
      <div class="asset-card-amount" id="totalAmount">¥0.00</div>
      <div class="asset-card-tags" id="totalTags"></div>
    </div>

    <!-- 趋势图 + 历史记录 -->
    <div class="module">
      <div class="module-header">
        <div class="module-tabs" id="trendTabs">
          <button class="module-tab active" onclick="setTrendMode('total')">总资金</button>
          <button class="module-tab" onclick="setTrendMode('category')">分类占比</button>
        </div>
        <div class="range-group">
          <button class="range-btn" data-range="all" onclick="setRange('all')">全部</button>
          <button class="range-btn" data-range="3y" onclick="setRange('3y')">近三年</button>
          <button class="range-btn active" data-range="1y" onclick="setRange('1y')">近一年</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>

      <div class="history-divider"><span>历史记录</span></div>
      <div id="historyContent"></div>
    </div>

    <!-- 分类占比饼图 -->
    <div class="module">
      <div class="module-header">
        <div class="module-title">分类占比</div>
        <div class="month-selector">
          <button class="month-btn" onclick="changeCatMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
          <span class="month-text" id="catMonthText">--</span>
          <button class="month-btn" onclick="changeCatMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
      <div class="chart-wrap" style="height:200px;"><canvas id="catPieChart"></canvas></div>
      <div class="cat-changes" id="catChanges"></div>
    </div>

    <!-- 各资产可视化 -->
    <div class="module">
      <div class="module-header">
        <div class="module-title">各资产</div>
        <div class="module-tabs" id="vizTabs">
          <button class="module-tab active" onclick="setVizMode('pie')">饼图</button>
          <button class="module-tab" onclick="setVizMode('bar')">柱形图</button>
        </div>
        <div class="month-selector">
          <button class="month-btn" onclick="changeAssetMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
          <span class="month-text" id="assetMonthText">--</span>
          <button class="month-btn" onclick="changeAssetMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
      <div id="vizContent"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/total.js"></script>
</body>
</html>
